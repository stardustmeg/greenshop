name: Continuous Integration

on:
  pull_request:
    branches:
      - develop
      - sprint-2
      - sprint-3
      - sprint-4
      - sprint-5

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Format code with Prettier
        run: npm run ci:format

  test:
    runs-on: ubuntu-latest

    env:
      VITE_APP_CTP_PROJECT_KEY: ${{ secrets.VITE_APP_CTP_PROJECT_KEY }}
      VITE_APP_CTP_CLIENT_SECRET: ${{ secrets.VITE_APP_CTP_CLIENT_SECRET }}
      VITE_APP_CTP_CLIENT_ID: ${{ secrets.VITE_APP_CTP_CLIENT_ID }}
      VITE_APP_CTP_REGION: ${{ secrets.VITE_APP_CTP_REGION }}
      VITE_APP_CTP_AUTH_URL: ${{ secrets.VITE_APP_CTP_AUTH_URL }}
      VITE_APP_CTP_API_URL: ${{ secrets.VITE_APP_CTP_API_URL }}
      VITE_APP_CTP_SCOPES: ${{ secrets.VITE_APP_CTP_SCOPES }}

      VITE_APP_DEFAULT_SEGMENT: ${{ secrets.VITE_APP_DEFAULT_SEGMENT }}
      VITE_APP_NEXT_SEGMENT: ${{ secrets.VITE_APP_NEXT_SEGMENT }}
      VITE_APP_PATH_SEGMENTS_TO_KEEP: ${{ secrets.VITE_APP_PATH_SEGMENTS_TO_KEEP }}
      VITE_APP_PROJECT_TITLE: ${{ secrets.VITE_APP_PROJECT_TITLE }}
      VITE_APP_SEARCH_SEGMENT: ${{ secrets.VITE_APP_SEARCH_SEGMENT }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Vitest tests
        run: npm test

      - name: Generate coverage report
        run: npm run coverage
